## Project
name: tasty_bytes
version: "1.0"
config-version: 2
profile: tasty_bytes

## Sources
model-paths: [models]
analysis-paths: [analysis]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]
snapshot-paths: [snapshots]

## Vars
vars:
  is_backfill: false
  refresh_start_ts: '1900-01-01'

## Target
target-path: target
clean-targets:
  - target
  - dbt_packages

## Models
models:
  tasty_bytes:
    staging:
      +materialized: view
    marts:
      +materialized: table
      +schema: mart
    facts:
      +materialized: table
      +schema: DEV
    dim:
      +materialized: table
      +schema: dim
  dbt_project_evaluator:
    +database: DBT_PROJECT_EVALUVATOR
    +schema: RAW_EVALUATION
  dbt_artifacts:
    +enabled: false
    sources:
      +enabled: true
      +database: DBT_ARTIFACTS # optional, default is your target database
      +schema: RAW

on-run-end:
  - "{% if target.name == 'dev' %}{{ dbt_artifacts.upload_results(results) }}{% endif %}"
